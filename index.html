<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Question For You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fdfbfb 100%);
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Plutajuća srca u pozadini */
        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.25);
            font-size: 20px;
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glavna kartica */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.25);
            text-align: center;
            max-width: 90%;
            width: 420px;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.9);
            transition: all 0.4s ease;
        }

        .heart-icon {
            font-size: 64px;
            display: inline-block;
            animation: heartbeat 1.3s infinite;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.2); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #d90429;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        p.subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
        }

        /* Gumb koji bježi ("No" - tj. pokušaj da kaže da ona voli više) */
        #runawayBtn {
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            color: white;
            box-shadow: 0 8px 20px rgba(201, 24, 74, 0.35);
            z-index: 20;
        }

        /* Gumb koji ostaje ("Yes" / "You love me more") */
        #stayBtn {
            background: #fff0f3;
            color: #c9184a;
            border: 2px solid #ffccd5;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        #stayBtn:hover {
            background: #ffe5ec;
        }

        /* Poruka nakon klika */
        .hidden {
            display: none !important;
        }

        .success-message h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .success-message p {
            color: #495057;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div id="questionBox">
            <div class="heart-icon">💖</div>
            <h1>Do you love me more?</h1>
            <p class="subtitle">Be honest... I already know the truth 😉</p>
            
            <div class="btn-group">
                <button id="runawayBtn">Yes, I do!</button>
                <button id="stayBtn">No, you do ❤️</button>
            </div>
        </div>

        <div id="successBox" class="success-message hidden">
            <div class="heart-icon">🥰</div>
            <h1>I knew it!</h1>
            <p>I love you more than words could ever explain, today and always. ❤️</p>
        </div>
    </div>

    <script>
        const runawayBtn = document.getElementById('runawayBtn');
        const stayBtn = document.getElementById('stayBtn');
        const questionBox = document.getElementById('questionBox');
        const successBox = document.getElementById('successBox');

        let dodgeCount = 0;
        const funnyTexts = [
            "Nice try! 😜",
            "Too slow! 💕",
            "Not a chance! 😘",
            "I love you more!",
            "Catch me if you can!",
            "Just admit it ❤️"
        ];

        // Funkcija za pomicanje gumba unutar vidljivog ekrana (i za mobitel i za PC)
        function moveButton(e) {
            if (e) e.preventDefault(); // Sprječava klik na mobitelu

            // Prebaci gumb na body ako još nije, kako bi fixed pozicioniranje radilo savršeno
            if (runawayBtn.parentElement !== document.body) {
                document.body.appendChild(runawayBtn);
                runawayBtn.style.position = 'fixed';
            }

            const btnWidth = runawayBtn.offsetWidth;
            const btnHeight = runawayBtn.offsetHeight;

            // Sigurne margine da gumb nikad ne pobjegne izvan ekrana mobitela
            const padding = 20;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            runawayBtn.style.left = `${randomX}px`;
            runawayBtn.style.top = `${randomY}px`;

            // Promijeni tekst gumba nakon par pokušaja
            dodgeCount++;
            if (dodgeCount <= funnyTexts.length) {
                runawayBtn.innerText = funnyTexts[dodgeCount - 1];
            } else {
                runawayBtn.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
            }

            // Lagano povećaj drugi gumb da ju privuče
            const currentScale = 1 + Math.min(dodgeCount * 0.06, 0.5);
            stayBtn.style.transform = `scale(${currentScale})`;
        }

        // Događaji za računalo (miš) i mobitel (dodir)
        runawayBtn.addEventListener('mouseover', moveButton);
        runawayBtn.addEventListener('touchstart', moveButton, { passive: false });
        runawayBtn.addEventListener('click', moveButton);

        // Klik na drugi gumb prikazuje romantičnu završnicu
        stayBtn.addEventListener('click', () => {
            questionBox.classList.add('hidden');
            runawayBtn.classList.add('hidden');
            successBox.classList.remove('hidden');
            createBurstHearts();
        });

        // Generiranje plutajućih srca u pozadini
        function createBackgroundHearts() {
            const hearts = ['❤️', '💖', '💕', '💗', '💓'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('bg-heart');
                heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }, 400);
        }

        // Eksplozija srca na kraju
        function createBurstHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('bg-heart');
                    heart.innerText = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    document.body.appendChild(heart);
                }, i * 60);
            }
        }

        createBackgroundHearts();
    </script>
</body>
</html>
